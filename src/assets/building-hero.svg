<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Edificio de un consorcio al atardecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="55%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <pattern id="windows" width="22" height="26" patternUnits="userSpaceOnUse">
      <rect x="5" y="5" width="9" height="11" fill="#fde68a" fill-opacity="0.85" />
    </pattern>
    <pattern id="windowsDim" width="22" height="26" patternUnits="userSpaceOnUse">
      <rect x="5" y="5" width="9" height="11" fill="#fbbf24" fill-opacity="0.45" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="url(#sky)" />
  <circle cx="620" cy="120" r="60" fill="url(#sun)" opacity="0.55" />

  <g opacity="0.55">
    <rect x="30" y="300" width="90" height="200" fill="#451a03" />
    <rect x="34" y="312" width="82" height="176" fill="url(#windowsDim)" />

    <rect x="640" y="260" width="100" height="240" fill="#451a03" />
    <rect x="644" y="272" width="92" height="216" fill="url(#windowsDim)" />
  </g>

  <rect x="130" y="180" width="70" height="320" fill="#3f2410" />
  <rect x="134" y="192" width="62" height="296" fill="url(#windows)" />

  <rect x="210" y="240" width="110" height="260" fill="#4a2911" />
  <rect x="214" y="252" width="102" height="236" fill="url(#windows)" />

  <rect x="330" y="110" width="85" height="390" fill="#3a2210" />
  <rect x="334" y="122" width="77" height="366" fill="url(#windows)" />
  <rect x="368" y="90" width="6" height="24" fill="#3a2210" />

  <rect x="425" y="210" width="95" height="290" fill="#4a2911" />
  <rect x="429" y="222" width="87" height="266" fill="url(#windows)" />

  <rect x="530" y="260" width="80" height="240" fill="#3f2410" />
  <rect x="534" y="272" width="72" height="216" fill="url(#windows)" />

  <rect x="0" y="490" width="800" height="10" fill="#1c0f04" />
</svg>
